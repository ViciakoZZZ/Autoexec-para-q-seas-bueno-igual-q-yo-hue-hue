// =========================================================
// AUTOEXEC PA KCHAR CABROS
// =========================================================
// ---------------------------------------------------------
// PARÁMETROS DE LANZAMIENTO
// ---------------------------------------------------------

-console -lv -novid -nojoy -high +exec autoexec.cfg 

// ---------------------------------------------------------
// 1. CONFIGURACIÓN DE RED Y TICKRATE (Rates para Server 100/128 Tick)
// ---------------------------------------------------------
rate "100000"
cl_cmdrate "128"
cl_updaterate "128"
cl_interp "0.0"
cl_interp_ratio "0"
cl_lagcompensation "1"
cl_resend "1.5"
cl_timeout "180"
net_maxroutable "1200"
net_splitrate "2"
net_splitpacket_maxrate "50000"
mm_dedicated_search_maxping "80"

// Bind rápido para cambiar rates según el servidor
bind "." "cl_cmdrate 128; cl_updaterate 128"
bind "," "cl_cmdrate 100; cl_updaterate 100"

// ---------------------------------------------------------
// 2. RENDIMIENTO VISUAL Y GRÁFICOS (FPS + Claridad)
// ---------------------------------------------------------
mat_queue_mode "2"                       // Fuerza renderizado multihilo (sube FPS)
mat_monitorgamma "1.6"                    // Brillo máximo para ver enemigos en zonas oscuras
mat_monitorgamma_tv_enabled "1"           // Amplía rango de brillo
mat_bloom_scalefactor_scalar "0"         // Desactiva el destello/bloom innecesario
mat_grain_scale_override "0"             // Desactiva el grano de película
r_dynamic "0"                            // Desactiva sombras dinámicas (gana muchos FPS)
muzzleflash_light "0"                    // Elimina destellos del arma al disparar
func_break_max_pieces "0"                // Reduce escombros y basura visual
r_cheapwaterstart "1"
r_cheapwaterend "1"                      // Simplifica el renderizado de agua
r_physpropstaticlighting "0"
cl_forcepreload "1"                      // Precarga mapas en RAM para evitar tirones
cl_ragdoll_limit "0"                     // Elimina cadáveres rápido para limpiar pantalla

// ---------------------------------------------------------
// 3. MOUSE Y SENSIBILIDAD (Input Lag 0 / Raw Input)
// ---------------------------------------------------------
m_rawinput "1"
m_filter "0"
m_filter2 "0"
m_customaccel "0"
m_mouseaccel1 "0"
m_mouseaccel2 "0"
m_mousespeed "0"

// ---------------------------------------------------------
// 4. CAMPO DE VISIÓN (FOV) Y CÁMARA
// ---------------------------------------------------------
fov_desired "110"                        // FOV amplio de visión periférica
cl_viewmodelfovsurvivor "80"              // Posición del arma
c_thirdpersonshoulder "0"                 // Bloquea vista en 3ª persona no oficial

// Toggle para ocultar/mostrar manos (Tecla X)
alias views_80 "cl_viewmodelfovsurvivor 80; alias changeview views_180"
alias views_180 "cl_viewmodelfovsurvivor 180; alias changeview views_80"
alias changeview "views_180"
bind "x" "changeview"

// ---------------------------------------------------------
// 5. CROSSHAIR (Mira Violeta Fija)
// ---------------------------------------------------------
crosshair "1"
cl_crosshair_alpha "255"
cl_crosshair_red "160"
cl_crosshair_green "0"
cl_crosshair_blue "255"
cl_crosshair_dynamic "0"

// ---------------------------------------------------------
// 6. MOVIMIENTO ANTI-GHOSTING (Null-Cancelling Movement)
// ---------------------------------------------------------
alias +mfwd "-back;+forward;alias checkfwd +forward"
alias +mback "-forward;+back;alias checkback +back"
alias +mleft "-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd;"
alias -mback "-back;checkfwd;alias checkback;"
alias -mleft "-moveleft;checkright;alias checkleft;"
alias -mright "-moveright;checkleft;alias checkright;"
alias checkfwd; alias checkback; alias checkleft; alias checkright;

bind "w" "+mfwd"
bind "a" "+mleft"
bind "s" "+mback"
bind "d" "+mright"

// Binds de rotación
bind "z" "+left"
bind "c" "+right"

// ---------------------------------------------------------
// 7. SILUETAS Y COLORES (Glows Competitivos)
// ---------------------------------------------------------
// Objetos e Infectados (Rojo / Magenta)
cl_glow_item_r "1"
cl_glow_item_g "0"
cl_glow_item_b "0.2"
cl_glow_item_far_r "1"
cl_glow_item_far_g "1"
cl_glow_item_far_b "1"
cl_glow_thirdstrike_item_r "1"
cl_glow_thirdstrike_item_g "0"
cl_glow_thirdstrike_item_b "0.2"
cl_glow_ability_r "1"
cl_glow_ability_g "0"
cl_glow_ability_b "0.2"

cl_glow_infected_r "1"
cl_glow_infected_g "0"
cl_glow_infected_b "0.2"
cl_glow_ghost_infected_r "1"
cl_glow_ghost_infected_g "1"
cl_glow_ghost_infected_b "1"

// Supervivientes por vida (Verde / Amarillo / Rojo)
cl_glow_survivor_health_high_r "0.0"
cl_glow_survivor_health_high_g "1.0"
cl_glow_survivor_health_high_b "0.0"

cl_glow_survivor_health_med_r "1.0"
cl_glow_survivor_health_med_g "1.0"
cl_glow_survivor_health_med_b "0.0"

cl_glow_survivor_health_low_r "1.0"
cl_glow_survivor_health_low_g "0.0"
cl_glow_survivor_health_low_b "0.0"

// Blanco si están en Blanco y Negro / Caídos
cl_glow_survivor_hurt_r "1"
cl_glow_survivor_hurt_g "1"
cl_glow_survivor_hurt_b "1"

// Vomitados por Boomer (Púrpura)
cl_glow_survivor_vomit_r "0.6"
cl_glow_survivor_vomit_g "0"
cl_glow_survivor_vomit_b "1"

cl_glow_infected_vomit_r "0.6"
cl_glow_infected_vomit_g "0"
cl_glow_infected_vomit_b "1"

// Witch
cl_witch_glow_idle_r "1"
cl_witch_glow_idle_g "1"
cl_witch_glow_idle_b "1"
cl_witch_glow_angry_r "1"
cl_witch_glow_angry_g "0"
cl_witch_glow_angry_b "0"

// ---------------------------------------------------------
// 8. UTILITIES, CONTROLES Y BINDS ÚTILES
// ---------------------------------------------------------
bind "tab" "+graph"
cl_showfps "0"
net_graphpos "3"
alias +graph "+showscores; net_graph 1"
alias -graph "-showscores; net_graph 0"

bind "f8" "toggleconsole"
bind "0" "disconnect"
bind "f5" "record 1; stop"                // Comando limpieza de glitch de sonido / animación
bind "f9" "openserverbrowser"
bind "p" "say_team !tank"

cl_autohelp "0"
cl_showhelp "0"
gameinstructor_enable "0"
cc_subtitles "1"
cl_showpos "1"

host_writeconfig
